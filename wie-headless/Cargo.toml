[package]
name = "wie-headless"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runs one app without a window: scripted keys, frame snapshots, timing and log as JSON (automated checks)"
repository.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
hashbrown = { version = "^0.17", features = ["default-hasher"], default-features = false }
image = { version = "^0.25", features = ["png"], default-features = false }
serde_json = "^1"
spin = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

wie = { workspace = true }
wie-backend = { workspace = true }
wie-util = { workspace = true }
